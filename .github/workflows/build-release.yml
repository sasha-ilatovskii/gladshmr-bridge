name: Build Firmware & Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ESP_IDF_VERSION: v6.0.1
      ESP_TARGET: esp32s3
      APP_NAME: monome-ble-raw

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp

          # Clone ESP-IDF v6.x with submodules
          git clone --branch "$ESP_IDF_VERSION" --depth 1 --recursive https://github.com/espressif/esp-idf.git

          cd esp-idf
          git submodule update --init --recursive --depth 1

          # Run installation
          ./install.sh "$ESP_TARGET"

          # Export environment
          source export.sh
          echo "IDF_PATH=$HOME/esp/esp-idf" >> $GITHUB_ENV

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py --version
          echo "✓ ESP-IDF environment ready"

      - name: Install clang-format
        run: |
          sudo apt-get install -y clang-format

      - name: Run clang-format check (informational)
        continue-on-error: true
        run: |
          echo "Checking code formatting..."
          find main -name "*.c" -o -name "*.h" | while read file; do
            clang-format --dry-run "$file" > /dev/null 2>&1 && echo "✓ $file" || echo "⚠️ $file needs formatting"
          done
          echo "Note: Format issues won't block release builds. Use 'clang-format -i main/*.c main/*.h' locally."

      - name: Build firmware
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py set-target "$ESP_TARGET"
          idf.py build

      - name: Check firmware size
        run: |
          source ~/esp/esp-idf/export.sh

          # Source the size limits
          source SIZE_LIMITS.txt

          BINARY_PATH="build/${APP_NAME}.bin"
          BINARY_SIZE=$(stat -f%z "$BINARY_PATH" 2>/dev/null || stat -c%s "$BINARY_PATH" 2>/dev/null)

          echo "Firmware size: $BINARY_SIZE bytes"
          echo "Max allowed: $MAX_FIRMWARE_SIZE bytes"
          echo "Warning threshold: $WARN_FIRMWARE_SIZE bytes"

          if [ $BINARY_SIZE -gt $MAX_FIRMWARE_SIZE ]; then
            echo "❌ FATAL: Firmware size exceeds maximum limit!"
            exit 1
          elif [ $BINARY_SIZE -gt $WARN_FIRMWARE_SIZE ]; then
            echo "⚠️ WARNING: Firmware size exceeds warning threshold"
          else
            echo "✓ Firmware size is within acceptable limits"
          fi

      - name: Prepare release and ESP Launchpad artifacts
        run: |
          source ~/esp/esp-idf/export.sh

          VERSION=${GITHUB_REF#refs/tags/}
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          OWNER=${GITHUB_REPOSITORY_OWNER}

          # ESP-IDF/esptool uses esp32s3, while ESP Launchpad TOML examples use ESP32-S3 / esp32-s3.
          case "$ESP_TARGET" in
            esp32) LAUNCHPAD_CHIPSET="ESP32"; LAUNCHPAD_IMAGE_KEY="esp32" ;;
            esp32s2) LAUNCHPAD_CHIPSET="ESP32-S2"; LAUNCHPAD_IMAGE_KEY="esp32-s2" ;;
            esp32s3) LAUNCHPAD_CHIPSET="ESP32-S3"; LAUNCHPAD_IMAGE_KEY="esp32-s3" ;;
            esp32c2) LAUNCHPAD_CHIPSET="ESP32-C2"; LAUNCHPAD_IMAGE_KEY="esp32-c2" ;;
            esp32c3) LAUNCHPAD_CHIPSET="ESP32-C3"; LAUNCHPAD_IMAGE_KEY="esp32-c3" ;;
            esp32c5) LAUNCHPAD_CHIPSET="ESP32-C5"; LAUNCHPAD_IMAGE_KEY="esp32-c5" ;;
            esp32c6) LAUNCHPAD_CHIPSET="ESP32-C6"; LAUNCHPAD_IMAGE_KEY="esp32-c6" ;;
            esp32h2) LAUNCHPAD_CHIPSET="ESP32-H2"; LAUNCHPAD_IMAGE_KEY="esp32-h2" ;;
            esp32p4) LAUNCHPAD_CHIPSET="ESP32-P4"; LAUNCHPAD_IMAGE_KEY="esp32-p4" ;;
            *) echo "Unsupported ESP_TARGET for Launchpad: $ESP_TARGET"; exit 1 ;;
          esac

          MERGED_BIN="${APP_NAME}-${VERSION}-${ESP_TARGET}-merged.bin"

          mkdir -p release-artifacts launchpad-site

          cp "build/${APP_NAME}.bin" "release-artifacts/${APP_NAME}-${VERSION}.bin"
          cp "build/${APP_NAME}.elf" "release-artifacts/${APP_NAME}-${VERSION}.elf"

          # ESP Launchpad flashes a single merged image at 0x0.
          # flash_args is generated by idf.py build and contains bootloader, partition table and app offsets.
          (cd build && esptool.py --chip "$ESP_TARGET" merge_bin -o "../release-artifacts/${MERGED_BIN}" @flash_args)

          cp "release-artifacts/${MERGED_BIN}" "launchpad-site/${MERGED_BIN}"

          cat > launchpad-site/config.toml <<EOF
          esp_toml_version = 1.0
          firmware_images_url = "https://${OWNER}.github.io/${REPO_NAME}/"
          supported_apps = ["${APP_NAME}"]

          [${APP_NAME}]
          chipsets = ["${LAUNCHPAD_CHIPSET}"]
          image.${LAUNCHPAD_IMAGE_KEY} = "${MERGED_BIN}"
          description = "${APP_NAME} ${VERSION} firmware"
          android_app_url = ""
          ios_app_url = ""
          EOF

          cp launchpad-site/config.toml release-artifacts/launchpad-config.toml

          cat > release-artifacts/README-flash-with-launchpad.md <<EOF
          # Flash ${APP_NAME} ${VERSION}

          Open ESP Launchpad:

          https://espressif.github.io/esp-launchpad/?flashConfigURL=https://${OWNER}.github.io/${REPO_NAME}/config.toml

          Recommended README button:

          [![Flash with ESP Launchpad](https://img.shields.io/badge/Flash%20with-ESP%20Launchpad-blue)](https://espressif.github.io/esp-launchpad/?flashConfigURL=https://${OWNER}.github.io/${REPO_NAME}/config.toml)
          EOF

          # Also include build log for debugging
          if [ -f build/build_log.txt ]; then
            cp build/build_log.txt "release-artifacts/"
          fi

          echo "ESP Launchpad URL: https://espressif.github.io/esp-launchpad/?flashConfigURL=https://${OWNER}.github.io/${REPO_NAME}/config.toml" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.bin
            release-artifacts/*.elf
            release-artifacts/*.md
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ESP Launchpad site
        uses: actions/upload-pages-artifact@v3
        with:
          path: launchpad-site

      - name: Deploy ESP Launchpad site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload build artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.ref_name }}
          path: |
            build/
            release-artifacts/
            launchpad-site/
            !build/.cmake
          retention-days: 7
