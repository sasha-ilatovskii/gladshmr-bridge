name: PR Checks - Build & Verify

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/esp-idf
          key: esp-idf-v5.2-${{ runner.os }}

      - name: Install ESP-IDF
        run: |
          mkdir -p ~/esp-idf
          cd ~/esp-idf
          if [ ! -d ".git" ]; then
            git clone --depth 1 --branch v5.2 https://github.com/espressif/esp-idf.git .
            ./install.sh esp32s3
          fi

      - name: Set up ESP-IDF environment
        run: |
          source ~/esp-idf/export.sh
          echo "IDF_PATH=$HOME/esp-idf" >> $GITHUB_ENV

      - name: Install clang-format
        run: |
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          echo "Checking code formatting..."
          find main -name "*.c" -o -name "*.h" | while read file; do
            clang-format --dry-run -Werror "$file" || exit 1
          done
          echo "✓ Code formatting check passed"

      - name: Build firmware
        run: |
          source ~/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Check firmware size
        run: |
          source ~/esp-idf/export.sh
          
          # Source the size limits
          source SIZE_LIMITS.txt
          
          BINARY_PATH="build/monome-ble-raw.bin"
          BINARY_SIZE=$(stat -f%z "$BINARY_PATH" 2>/dev/null || stat -c%s "$BINARY_PATH" 2>/dev/null)
          
          echo "Firmware size: $BINARY_SIZE bytes"
          echo "Max allowed: $MAX_FIRMWARE_SIZE bytes"
          echo "Warning threshold: $WARN_FIRMWARE_SIZE bytes"
          
          if [ $BINARY_SIZE -gt $MAX_FIRMWARE_SIZE ]; then
            echo "❌ FATAL: Firmware size exceeds maximum limit!"
            exit 1
          elif [ $BINARY_SIZE -gt $WARN_FIRMWARE_SIZE ]; then
            echo "⚠️ WARNING: Firmware size exceeds warning threshold"
          else
            echo "✓ Firmware size is within acceptable limits"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-artifacts-${{ github.event.pull_request.number }}
          path: |
            build/monome-ble-raw.bin
            build/monome-ble-raw.elf
          retention-days: 7

      - name: Comment PR with build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const BINARY_PATH = 'build/monome-ble-raw.bin';
            
            let status = '✅ Build successful';
            let details = '';
            
            if (fs.existsSync(BINARY_PATH)) {
              const size = fs.statSync(BINARY_PATH).size;
              details = `\n📦 Firmware size: **${(size / 1024).toFixed(2)} KB**`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status}${details}`
            });
