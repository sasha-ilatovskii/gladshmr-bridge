name: PR Checks - Build & Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ESP_IDF_VERSION: v6.0.1
      ESP_TARGET: esp32s3
      APP_NAME: monome-ble-raw
      IDF_CCACHE_ENABLE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF tools and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cache/ccache
          key: ${{ runner.os }}-esp-idf-${{ env.ESP_IDF_VERSION }}-${{ env.ESP_TARGET }}-${{ hashFiles('sdkconfig.defaults', 'sdkconfig', 'CMakeLists.txt', 'main/**') }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-${{ env.ESP_IDF_VERSION }}-${{ env.ESP_TARGET }}-
            ${{ runner.os }}-esp-idf-${{ env.ESP_IDF_VERSION }}-

      - name: Install ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp

          if [ ! -d "esp-idf/.git" ]; then
            git clone --branch "$ESP_IDF_VERSION" --depth 1 --recursive https://github.com/espressif/esp-idf.git
          fi

          cd esp-idf
          git fetch --depth 1 origin "$ESP_IDF_VERSION"
          git checkout "$ESP_IDF_VERSION"
          git submodule update --init --recursive --depth 1

          ./install.sh "$ESP_TARGET"
          echo "IDF_PATH=$HOME/esp/esp-idf" >> "$GITHUB_ENV"

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py --version
          idf.py --list-targets | grep -q "^$ESP_TARGET$"
          echo "✓ ESP-IDF environment ready for $ESP_TARGET"

      - name: Install clang-format
        run: |
          sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          echo "Checking C/C++ formatting on PR..."

          mapfile -d '' files < <(find main -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No source files found under main/, skipping clang-format check."
            exit 0
          fi

          clang-format --dry-run --Werror "${files[@]}"
          echo "✓ Code formatting check passed"

      - name: Build firmware
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py set-target "$ESP_TARGET"
          idf.py build

      - name: Check firmware size
        run: |
          source ~/esp/esp-idf/export.sh

          if [ -f SIZE_LIMITS.txt ]; then
            source SIZE_LIMITS.txt
          else
            echo "SIZE_LIMITS.txt not found, skipping firmware size limit check."
            exit 0
          fi

          BINARY_PATH="build/${APP_NAME}.bin"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Firmware binary not found: $BINARY_PATH"
            echo "Available .bin files:"
            find build -name "*.bin" -maxdepth 3 -print || true
            exit 1
          fi

          BINARY_SIZE=$(stat -c%s "$BINARY_PATH")

          echo "Firmware size: $BINARY_SIZE bytes"
          echo "Max allowed: $MAX_FIRMWARE_SIZE bytes"
          echo "Warning threshold: $WARN_FIRMWARE_SIZE bytes"

          if [ "$BINARY_SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ FATAL: Firmware size exceeds maximum limit!"
            exit 1
          elif [ "$BINARY_SIZE" -gt "$WARN_FIRMWARE_SIZE" ]; then
            echo "⚠️ WARNING: Firmware size exceeds warning threshold"
          else
            echo "✓ Firmware size is within acceptable limits"
          fi

          {
            echo "### Firmware size"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Binary | \`$BINARY_PATH\` |"
            echo "| Size | $BINARY_SIZE bytes |"
            echo "| Warning threshold | $WARN_FIRMWARE_SIZE bytes |"
            echo "| Maximum allowed | $MAX_FIRMWARE_SIZE bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-artifacts-${{ github.event.pull_request.number }}
          path: |
            build/${{ env.APP_NAME }}.bin
            build/${{ env.APP_NAME }}.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            build/flash_args
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment PR with build status
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-checks-build-status -->';
            const binaryPath = `build/${process.env.APP_NAME}.bin`;
            const conclusion = '${{ job.status }}';

            const statusText = conclusion === 'success'
              ? '✅ PR checks passed'
              : '❌ PR checks failed';

            let details = '';
            if (fs.existsSync(binaryPath)) {
              const size = fs.statSync(binaryPath).size;
              details += `\n\n📦 Firmware size: **${(size / 1024).toFixed(2)} KB** (${size} bytes)`;
            } else {
              details += `\n\n⚠️ Firmware binary was not produced.`;
            }

            const body = `${marker}\n${statusText}${details}\n\nESP-IDF: \`${process.env.ESP_IDF_VERSION}\`  \nTarget: \`${process.env.ESP_TARGET}\``;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
